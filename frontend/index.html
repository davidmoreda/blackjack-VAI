<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack VAI — Card Counter</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --felt:       #0b1a0e;
      --panel:      #0e1f12;
      --panel2:     #122318;
      --gold:       #c9a227;
      --gold-dim:   #7a6118;
      --text:       #e8dcc8;
      --text-dim:   #8a8070;
      --green-pos:  #4ade80;
      --red-neg:    #f87171;
      --blue-acc:   #60a5fa;
      --border:     rgba(201,162,39,0.25);
      --border-hi:  rgba(201,162,39,0.7);
    }

    body {
      background: var(--felt);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header {
      height: 52px;
      background: linear-gradient(90deg, #060e07 0%, #0e1f12 50%, #060e07 100%);
      border-bottom: 1px solid var(--border-hi);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #header-logo .suits {
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: var(--gold);
    }
    #header-logo .suits .red { color: #e05252; }
    #header-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #header-title span {
      color: var(--text-dim);
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
      margin-left: 8px;
      vertical-align: middle;
    }
    #header-status {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4a5568;
      display: inline-block;
    }
    .status-dot.live {
      background: var(--green-pos);
      box-shadow: 0 0 6px var(--green-pos);
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity:1; } 50% { opacity:0.4; }
    }
    #ws-status {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    #game-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--gold-dim);
      color: var(--text-dim);
      background: transparent;
      transition: all 0.3s;
    }
    #game-badge.active {
      border-color: var(--green-pos);
      color: var(--green-pos);
      background: rgba(74,222,128,0.08);
    }

    /* ── MAIN LAYOUT ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── CAMERA ── */
    #camera-panel {
      flex: 1;
      position: relative;
      background: #000;
    }
    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #cam-overlay {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.65);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: 'Roboto Mono', monospace;
      letter-spacing: 0.5px;
    }

    /* ── SIDE PANEL ── */
    #side-panel {
      width: 360px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dim) transparent;
    }

    .section {
      border-bottom: 1px solid var(--border);
      padding: 16px 18px;
    }
    .section-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── COUNT DISPLAY ── */
    #count-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
    }
    .count-big-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    #running-count {
      font-family: 'Roboto Mono', monospace;
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
      transition: color 0.4s;
    }
    #running-count.positive { color: var(--green-pos); }
    #running-count.negative { color: var(--red-neg); }
    #true-count-wrap {
      text-align: right;
    }
    #true-count {
      font-family: 'Roboto Mono', monospace;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--blue-acc);
    }

    /* Barra de ventaja */
    .adv-bar-wrap {
      margin-bottom: 14px;
    }
    .adv-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .adv-bar-bg {
      height: 6px;
      background: #1a2e1e;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #adv-bar-fill {
      height: 100%;
      width: 50%;
      background: var(--text-dim);
      border-radius: 3px;
      transition: width 0.5s ease, background 0.5s ease;
    }

    .count-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .count-cell {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .count-cell-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 3px;
    }
    .count-cell-val {
      font-family: 'Roboto Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── SUGGESTION ── */
    #suggestion-box {
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      background: #1a2e1e;
      border: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s;
    }
    #suggestion-box.hit    { background: #2d1010; border-color: #e05252; }
    #suggestion-box.stand  { background: #0e2e18; border-color: var(--green-pos); }
    #suggestion-box.double { background: #0f1e35; border-color: var(--blue-acc); }
    #suggestion-box.split  { background: #1e0f35; border-color: #a78bfa; }
    #suggestion-box.wait   { background: #1a2e1e; border-color: var(--border); }
    .sug-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    #suggestion-action {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* ── PLAYER BLOCKS ── */
    .player-block {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .player-block.active-player {
      border-color: var(--blue-acc);
      box-shadow: 0 0 0 1px rgba(96,165,250,0.3);
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .player-name {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .player-total-badge {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      padding: 1px 7px;
    }
    .player-total-badge.bust { color: var(--red-neg); }
    .player-total-badge.bj   { color: #f6e05e; }
    .player-cards-row {
      font-size: 0.92rem;
      letter-spacing: 1px;
      color: var(--text);
      min-height: 20px;
    }
    .card-tag {
      display: inline-block;
      background: #fff;
      color: #111;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 4px;
      letter-spacing: 0;
    }
    .card-tag.red { color: #c0392b; }

    /* ── SEEN CARDS ── */
    /* Alertas de mano */
    .hand-alert {
      display: none;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 6px;
      animation: alert-blink 0.4s ease-in-out infinite alternate;
    }
    .hand-alert.bust       { display:block; background:#2d0000; border:2px solid #f87171; color:#f87171; }
    .hand-alert.twentyone  { display:block; background:#1a1a00; border:2px solid #fbbf24; color:#fbbf24; }
    .hand-alert.blackjack  { display:block; background:#1a1200; border:2px solid #f59e0b; color:#f59e0b; }
    @keyframes alert-blink {
      from { opacity: 1; } to { opacity: 0.5; }
    }

    .seen-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .seen-chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      letter-spacing: 0.3px;
    }
    .seen-chip.red { border-color: rgba(240,100,100,0.4); color: #fca5a5; }
    .seen-empty { font-size: 0.78rem; color: var(--text-dim); font-style: italic; }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 11px 8px;
      border: 1px solid;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-start {
      background: transparent;
      border-color: var(--gold);
      color: var(--gold);
      font-size: 0.8rem;
      padding: 13px;
      width: 100%;
    }
    .btn-start.active {
      background: rgba(201,162,39,0.12);
    }
    .btn-stand {
      background: transparent;
      border-color: var(--green-pos);
      color: var(--green-pos);
    }
    .btn-reset {
      background: transparent;
      border-color: var(--red-neg);
      color: var(--red-neg);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header">
    <div id="header-logo">
      <span class="suits">♠ <span class="red">♥</span> <span class="red">♦</span> ♣</span>
      <div>
        <div id="header-title">Blackjack VAI<span>CARD COUNTER</span></div>
      </div>
    </div>
    <div id="header-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="ws-status">CONECTANDO</span>
      <span id="game-badge">EN ESPERA</span>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- CAMERA -->
    <div id="camera-panel">
      <img id="camera-feed" src="/video_feed" alt="Feed" />
      <div id="cam-overlay">LIVE · YOLOv8m-seg</div>
    </div>

    <!-- SIDE PANEL -->
    <div id="side-panel">

      <!-- CONTEO -->
      <div class="section">
        <div class="section-title">Conteo Hi-Lo</div>
        <div id="count-main">
          <div>
            <div class="count-big-label">Running Count</div>
            <div id="running-count">0</div>
          </div>
          <div id="true-count-wrap">
            <div class="count-big-label" style="text-align:right">True Count</div>
            <div id="true-count">0.0</div>
          </div>
        </div>
        <div class="adv-bar-wrap">
          <div class="adv-bar-labels">
            <span>Casa</span>
            <span>Ventaja</span>
            <span>Jugador</span>
          </div>
          <div class="adv-bar-bg">
            <div id="adv-bar-fill"></div>
          </div>
        </div>
        <div class="count-grid">
          <div class="count-cell">
            <div class="count-cell-label">Mazos rest.</div>
            <div class="count-cell-val" id="decks-remaining">6.0</div>
          </div>
          <div class="count-cell">
            <div class="count-cell-label">Cartas vistas</div>
            <div class="count-cell-val" id="cards-seen">0</div>
          </div>
        </div>
      </div>

      <!-- SUGERENCIA -->
      <div class="section">
        <div class="section-title">Estrategia básica</div>
        <div id="suggestion-box" class="wait">
          <div class="sug-label">Acción recomendada</div>
          <div id="suggestion-action">—</div>
        </div>
      </div>

      <!-- ALERTAS -->
      <div id="alerts-container"></div>

      <!-- MESA -->
      <div class="section">
        <div class="section-title">Mesa</div>
        <div id="players-container"></div>
      </div>

      <!-- CARTAS DETECTADAS -->
      <div class="section">
        <div class="section-title">Cartas esta ronda</div>
        <div id="seen-cards-container">
          <span class="seen-empty">Sin detecciones</span>
        </div>
      </div>

      <!-- CONTROLES -->
      <div class="section">
        <div class="section-title">Control</div>
        <button class="btn btn-start" id="btn-start" onclick="sendStart()">
          ♠ EMPEZAR A JUGAR
        </button>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn btn-stand" id="btn-stand" onclick="sendStand()" disabled>Plantarse</button>
          <button class="btn btn-reset" id="btn-reset" onclick="sendReset()" disabled>Nueva ronda</button>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/panel.js"></script>
</body>
</html>
