<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack VAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

    #camera-panel { flex: 1; position: relative; background: #000; }
    #camera-feed { width: 100%; height: 100%; object-fit: contain; }
    #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    #side-panel { width: 340px; background: #16213e; display: flex; flex-direction: column; padding: 16px; gap: 14px; overflow-y: auto; }

    .card-section { background: #0f3460; border-radius: 10px; padding: 14px; }
    .card-section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a0aec0; margin-bottom: 10px; }

    .count-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .count-label { font-size: 0.85rem; color: #a0aec0; }
    .count-value { font-size: 1.4rem; font-weight: bold; color: #63b3ed; }

    .true-count { font-size: 1.1rem; }

    .suggestion-box { background: #2d6a4f; border-radius: 8px; padding: 12px; text-align: center; }
    .suggestion-box.hit    { background: #c05621; }
    .suggestion-box.stand  { background: #276749; }
    .suggestion-box.double { background: #2b6cb0; }
    .suggestion-box.split  { background: #6b46c1; }
    .suggestion-label { font-size: 0.75rem; color: rgba(255,255,255,0.7); }
    .suggestion-action { font-size: 2rem; font-weight: bold; letter-spacing: 2px; }

    .player-block { background: #1a365d; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .player-name { font-size: 0.75rem; color: #90cdf4; font-weight: bold; margin-bottom: 4px; }
    .player-cards { font-size: 1rem; letter-spacing: 1px; }
    .player-total { font-size: 0.9rem; color: #68d391; }
    .player-total.bust { color: #fc8181; }
    .player-total.bj   { color: #f6e05e; }

    .prob-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .prob-bar-wrap { width: 80px; background: #2d3748; border-radius: 4px; height: 8px; margin-top: 2px; }
    .prob-bar { height: 8px; border-radius: 4px; background: #63b3ed; }

    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-stand  { background: #276749; color: #fff; }
    .btn-reset  { background: #742a2a; color: #fff; }

    #status-bar { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; color: #a0aec0; }
  </style>
</head>
<body>
  <div id="camera-panel">
    <img id="camera-feed" src="/video_feed" alt="Camara" />
    <canvas id="overlay-canvas"></canvas>
    <div id="status-bar">Conectando...</div>
  </div>

  <div id="side-panel">
    <!-- Conteo -->
    <div class="card-section">
      <h3>Conteo de cartas</h3>
      <div class="count-box">
        <span class="count-label">Running Count</span>
        <span class="count-value" id="running-count">0</span>
      </div>
      <div class="count-box">
        <span class="count-label">True Count</span>
        <span class="count-value true-count" id="true-count">0.0</span>
      </div>
      <div class="count-box">
        <span class="count-label">Mazos restantes</span>
        <span class="count-value" style="font-size:1rem" id="decks-remaining">6.0</span>
      </div>
      <div class="count-box">
        <span class="count-label">Cartas vistas</span>
        <span class="count-value" style="font-size:1rem" id="cards-seen">0</span>
      </div>
    </div>

    <!-- Sugerencia -->
    <div class="card-section">
      <h3>Sugerencia optima</h3>
      <div class="suggestion-box stand" id="suggestion-box">
        <div class="suggestion-label">Basic Strategy recomienda</div>
        <div class="suggestion-action" id="suggestion-action">—</div>
      </div>
    </div>

    <!-- Manos de jugadores -->
    <div class="card-section">
      <h3>Jugadores</h3>
      <div id="players-container"></div>
    </div>

    <!-- Probabilidades -->
    <div class="card-section">
      <h3>Probabilidades prox. carta</h3>
      <div id="probs-container">
        <div class="prob-row"><span>Alta (10/J/Q/K)</span><span id="prob-high">—</span></div>
        <div class="prob-row"><span>Baja (2-6)</span><span id="prob-low">—</span></div>
        <div class="prob-row"><span>Neutra (7-9)</span><span id="prob-neutral">—</span></div>
        <div class="prob-row"><span>As</span><span id="prob-ace">—</span></div>
      </div>
    </div>

    <!-- Acciones -->
    <div class="card-section">
      <h3>Acciones</h3>
      <button class="btn btn-stand" id="btn-stand" onclick="sendStand()">PLANTARSE</button>
      <br/><br/>
      <button class="btn btn-reset" onclick="sendReset()">NUEVA RONDA</button>
    </div>
  </div>

  <script src="/static/panel.js"></script>
</body>
</html>
