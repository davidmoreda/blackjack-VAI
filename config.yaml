api:
  host: 0.0.0.0
  port: 8080
camera:
  fps: 30
  height: 720
  index: "http://host.docker.internal:5050/video"
  width: 1280
detection:
  backend: yolo
  confidence: 0.55
  imgsz: 1280
  inference_fps: 15
  iou: 0.45
  model_path: models/best.pt
depth_anything:
  enabled: true          # true para activar normales en tiempo real
  variant: small          # small | base | large
  fps: 5                  # inferencias de depth por segundo (costoso)
  axis_length: 60         # longitud en píxeles de los ejes XYZ
  kalman_process_noise: 0.001
  kalman_measurement_noise: 0.05
game:
  counting_system: hilo
  num_decks: 1
  num_players: 1
zones:
  dealer:
    h: 0.4
    w: 1.0
    x: 0.0
    y: 0.0
  player_1:
    h: 0.6
    w: 0.5
    x: 0.0
    y: 0.4
  player_2:
    h: 0.6
    w: 0.5
    x: 0.5
    y: 0.4
