[project]
name = "blackjack-vai"
version = "0.1.0"
description = "BlackjackVAI — detección de cartas con YOLO + Depth Anything v2"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "transformers>=4.40.0",
    "torch>=2.1.0",
    "Pillow>=10.0.0",
    "mlflow>=2.12.0",
    "ipykernel>=6.29.0",
]

[tool.uv]
# Para arrancar el servidor de MLflow local apuntando a la BD del repo:
#   uv run mlflow ui --backend-store-uri sqlite:///mlflow.db --port 5000
